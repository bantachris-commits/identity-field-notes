name: Refresh Identity Radar
on:
  schedule:
    - cron: '35 */6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ifn-radar-v2
  cancel-in-progress: false

jobs:
  radar:
    timeout-minutes: 25
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-automation.txt
      - name: Refresh current reading radar
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
        run: python scripts/update_radar_ai.py
      - name: Validate site after Radar refresh
        run: python scripts/check_site.py
      - name: Commit radar
        run: |
          git config user.name "identity-field-notes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/radar.json data/radar-status.json
          if git diff --cached --quiet; then
            echo "No Radar changes to commit."
          else
            git commit -m "radar: refresh identity reading queue"
            git pull --rebase origin main
            git push
          fi

  # Pages deployment is intentionally handled only by deploy.yml.
  # Any radar content commit above triggers it automatically.
