name: Refresh events and training
on:
  schedule:
    - cron: '20 12 * * 0'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  directories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openai
      - name: Refresh directories with web search
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
        run: python scripts/refresh_directories.py
      - name: Commit directory updates
        run: |
          git config user.name "identity-field-notes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json data/training.json
          git diff --cached --quiet || git commit -m "directory: refresh events and training"
          git push
  deploy:
    needs: directories
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy refreshed directories
        id: deployment
        uses: actions/deploy-pages@v4
