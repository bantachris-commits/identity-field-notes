name: Refresh website morning recap
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/refresh-recap.yml']

permissions: {}

concurrency:
  group: content-writers
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-automation.txt
      - name: Prepare explicitly requested website recap replacement
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          p = Path('data/articles.json')
          today = datetime.now(ZoneInfo('America/Denver')).date().isoformat()
          articles = json.loads(p.read_text())
          articles = [a for a in articles if a.get('date') != today or a.get('humanWritten') or a.get('contentType') == 'guest']
          p.write_text(json.dumps(articles))
          PY
      - name: Recap yesterday's notable Latest Articles
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
        run: |
          python scripts/generate_daily.py
          python - <<'PY'
          import json
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          today = datetime.now(ZoneInfo('America/Denver')).date()
          articles = json.load(open('data/articles.json'))
          assert any(a.get('date') == today.isoformat() and a.get('coverageDate') == (today-timedelta(days=1)).isoformat() and a.get('stories') for a in articles), 'No replacement recap generated; leaving production unchanged'
          PY
      - name: Build RSS and sitemap
        run: python scripts/build_feeds.py
      - name: Validate generated publication
        run: python scripts/check_site.py
      - name: Commit publication update
        run: |
          git config user.name "identity-field-notes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/articles.json feed.xml sitemap.xml
          if git diff --cached --quiet; then
            echo "No publication changes to commit."
          else
            git commit -m "publish: weekday identity field note"
            git pull --rebase origin main
            git push
          fi

  deploy:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate site before deploy
        run: python scripts/check_site.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: '.'
      - name: Deploy today's Field Note
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
