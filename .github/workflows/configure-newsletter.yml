name: Configure newsletter signup
on:
  workflow_dispatch:
    inputs:
      username:
        description: Buttondown newsletter username
        required: true
        type: string

permissions:
  contents: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write Buttondown username
        env:
          BUTTONDOWN_USERNAME: ${{ inputs.username }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          username=os.environ['BUTTONDOWN_USERNAME'].strip()
          if not username or any(c.isspace() for c in username):
              raise SystemExit('Invalid Buttondown username')
          p=Path('assets/config.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'(buttondownUsername:\s*)"[^"]*"', lambda m: m.group(1)+f'"{username}"', s, count=1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit newsletter configuration
        run: |
          git config user.name "identity-field-notes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/config.js
          git diff --cached --quiet || git commit -m "config: connect Buttondown signup"
          git push
