name: Send morning edition format preview
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: format-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
      BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements-automation.txt
      - name: Send a separate preview to the sole subscriber
        run: python scripts/send_format_preview.py
