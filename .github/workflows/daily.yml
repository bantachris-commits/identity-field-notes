name: Publish weekday Field Note
on:
  # UTC scheduling matches the other working scheduled workflows.
  # The run gate selects 06:15 and 07:15 Denver across DST changes.
  schedule:
    - cron: '15 12 * * 1-5'
    - cron: '15 13 * * 1-5'
    - cron: '15 14 * * 1-5'
  # Temporary end-to-end recovery trigger; removed after verification.
  push:
    branches: [main]
    paths: ['.github/workflows/daily.yml']
  workflow_dispatch:

permissions: {}

concurrency:
  group: content-writers
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-automation.txt
      - name: Run gate
        id: gate
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: |
          DENVER_OFFSET=$(TZ=America/Denver date +%z)
          echo "Trigger: $TRIGGER_EVENT; Denver time: $(TZ=America/Denver date -Iseconds)" >> "$GITHUB_STEP_SUMMARY"
          SKIP=no
          if [ "$TRIGGER_EVENT" = "schedule" ]; then
            if [ "$DENVER_OFFSET" = "-0600" ] && [ "$TRIGGER_SCHEDULE" = "15 14 * * 1-5" ]; then SKIP=yes; fi
            if [ "$DENVER_OFFSET" = "-0700" ] && [ "$TRIGGER_SCHEDULE" = "15 12 * * 1-5" ]; then SKIP=yes; fi
          fi
          if [ "$SKIP" = "yes" ]; then
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "Skipping the UTC slot outside the Denver morning window." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
            echo "Running publication, deployment, and eligible email delivery." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Collect RSS supplement
        if: steps.gate.outputs.run == 'yes'
        run: python scripts/collect_radar.py
      - name: Generate daily Field Note with web search
        if: steps.gate.outputs.run == 'yes'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
        run: python scripts/generate_daily.py
      - name: Build RSS and sitemap
        if: steps.gate.outputs.run == 'yes'
        run: python scripts/build_feeds.py
      - name: Validate generated publication
        if: steps.gate.outputs.run == 'yes'
        run: python scripts/check_site.py
      - name: Commit publication update
        if: steps.gate.outputs.run == 'yes'
        run: |
          git config user.name "identity-field-notes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/articles.json data/radar.json feed.xml sitemap.xml
          if git diff --cached --quiet; then
            echo "No publication changes to commit."
          else
            git commit -m "publish: weekday identity field note"
            git pull --rebase origin main
            git push
          fi

  deploy:
    needs: publish
    if: needs.publish.outputs.run == 'yes'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate site before deploy
        run: python scripts/check_site.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: '.'
      - name: Deploy today's Field Note
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  digest:
    needs: [publish, deploy]
    if: needs.publish.outputs.run == 'yes'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
      BUTTONDOWN_MODE: ${{ vars.BUTTONDOWN_MODE || 'draft' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-email.txt
      - name: Check for a new Field Note today
        id: freshness
        shell: bash
        run: |
          TODAY=$(TZ=America/Denver date +%F)
          ARTICLE_DATE=$(python -c "import json; a=json.load(open('data/articles.json',encoding='utf-8')); print(next((x.get('date','') for x in a if x.get('featured') and not x.get('humanWritten') and x.get('contentType')!='guest'),''))")
          if [ "$ARTICLE_DATE" = "$TODAY" ]; then
            echo "send=yes" >> "$GITHUB_OUTPUT"
            echo "Today's Field Note exists; digest is eligible to send."
          else
            echo "send=no" >> "$GITHUB_OUTPUT"
            echo "No new Field Note today; skipping the digest."
          fi
      - name: Create or send Buttondown digest
        if: env.BUTTONDOWN_API_KEY != '' && steps.freshness.outputs.send == 'yes'
        run: python scripts/push_buttondown.py
      - name: Quiet morning - no digest
        if: steps.freshness.outputs.send != 'yes'
        run: echo "No genuinely new Field Note was published today, so no digest will be created or sent."
      - name: Newsletter not configured
        if: env.BUTTONDOWN_API_KEY == '' && steps.freshness.outputs.send == 'yes'
        run: echo "BUTTONDOWN_API_KEY is not configured; site publication completed without email."
