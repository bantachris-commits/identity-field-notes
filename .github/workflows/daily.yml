name: Publish weekday Field Note
on:
  # ChatGPT's scheduled task updates this dated request through the GitHub app.
  push:
    branches: [main]
    paths: ['.github/publish-request.json']
  # Retry opportunities throughout the Denver morning/day; GitHub cron can arrive hours late.
  schedule:
    - cron: '23 12-23 * * 1-5'
  workflow_dispatch:
  workflow_run:
    workflows: [Refresh Identity Radar]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: content-writers
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    timeout-minutes: 45
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-automation.txt
      - name: Run gate
        id: gate
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
        run: python scripts/publication_gate.py
      - name: Ensure overnight article discovery completed
        if: steps.gate.outputs.run == 'yes'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
        run: python scripts/ensure_radar.py
      - name: Recap yesterday's notable Latest Articles
        if: steps.gate.outputs.run == 'yes'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
        run: python scripts/generate_daily.py
      - name: Build RSS and sitemap
        if: steps.gate.outputs.run == 'yes'
        run: python scripts/build_feeds.py
      - name: Validate generated publication
        if: steps.gate.outputs.run == 'yes'
        run: python scripts/check_site.py
      - name: Commit publication update
        if: steps.gate.outputs.run == 'yes'
        run: |
          git config user.name "identity-field-notes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/articles.json feed.xml sitemap.xml
          if [ -f data/radar-status.json ]; then git add data/radar.json data/radar-status.json; fi
          if git diff --cached --quiet; then
            echo "No publication changes to commit."
          else
            git commit -m "publish: weekday identity field note"
            git pull --rebase origin main
            git push
          fi

  deploy:
    timeout-minutes: 10
    needs: publish
    if: needs.publish.outputs.run == 'yes'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      queue: max
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate site before deploy
        run: python scripts/check_site.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: '.'
      - name: Deploy today's Field Note
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  digest:
    timeout-minutes: 5
    needs: [publish, deploy]
    if: needs.publish.outputs.run == 'yes'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
      BUTTONDOWN_MODE: send
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-email.txt
      - name: Create or send the morning recap and Community Voices
        if: env.BUTTONDOWN_API_KEY != ''
        run: python scripts/push_buttondown.py
      - name: Newsletter not configured
        if: env.BUTTONDOWN_API_KEY == ''
        run: |
          echo "::error::BUTTONDOWN_API_KEY is not configured; cannot deliver the morning edition."
          exit 1
