name: Publish weekday Field Note
on:
  schedule:
    - cron: '15 6 * * 1-5'
      timezone: 'America/Denver'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openai requests feedparser
      - name: Run gate
        id: gate
        run: echo "run=yes" >> "$GITHUB_OUTPUT"
      - name: Collect RSS supplement
        if: steps.gate.outputs.run == 'yes'
        run: python scripts/collect_radar.py
      - name: Generate daily Field Note with web search
        if: steps.gate.outputs.run == 'yes'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
        run: python scripts/generate_daily.py
      - name: Build RSS and sitemap
        if: steps.gate.outputs.run == 'yes'
        run: python scripts/build_feeds.py
      - name: Validate generated publication
        if: steps.gate.outputs.run == 'yes'
        run: python scripts/check_site.py
      - name: Commit publication update
        if: steps.gate.outputs.run == 'yes'
        run: |
          git config user.name "identity-field-notes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ feed.xml sitemap.xml
          git diff --cached --quiet || git commit -m "publish: weekday identity field note"
          git push

  deploy:
    needs: publish
    if: needs.publish.outputs.run == 'yes'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate site before deploy
        run: python scripts/check_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy today's Field Note
        id: deployment
        uses: actions/deploy-pages@v4

  digest:
    needs: [publish, deploy]
    if: needs.publish.outputs.run == 'yes'
    runs-on: ubuntu-latest
    env:
      BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
      BUTTONDOWN_MODE: ${{ vars.BUTTONDOWN_MODE || 'draft' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Check for a new Field Note today
        id: freshness
        shell: bash
        run: |
          TODAY=$(TZ=America/Denver date +%F)
          ARTICLE_DATE=$(python -c "import json; a=json.load(open('data/articles.json',encoding='utf-8')); print(next((x.get('date','') for x in a if x.get('featured') and not x.get('humanWritten') and x.get('contentType')!='guest'),''))")
          if [ "$ARTICLE_DATE" = "$TODAY" ]; then
            echo "send=yes" >> "$GITHUB_OUTPUT"
            echo "Today's Field Note exists; digest is eligible to send."
          else
            echo "send=no" >> "$GITHUB_OUTPUT"
            echo "No new Field Note today; skipping the digest."
          fi
      - name: Create or send Buttondown digest
        if: env.BUTTONDOWN_API_KEY != '' && steps.freshness.outputs.send == 'yes'
        run: python scripts/push_buttondown.py
      - name: Quiet morning - no digest
        if: steps.freshness.outputs.send != 'yes'
        run: echo "No genuinely new Field Note was published today, so no digest will be created or sent."
      - name: Newsletter not configured
        if: env.BUTTONDOWN_API_KEY == '' && steps.freshness.outputs.send == 'yes'
        run: echo "BUTTONDOWN_API_KEY is not configured; site publication completed without email."
