name: Deploy static site to GitHub Pages
on:
  # Human/connector changes to main still deploy immediately.
  push:
    branches: [main]
    paths-ignore: ['.github/publish-request.json']
  # Content commits made inside Actions use GITHUB_TOKEN. GitHub intentionally
  # suppresses new workflow runs from those pushes, so deploy on completion of
  # the content-producing workflows as well and always checkout latest main.
  workflow_run:
    workflows: [Publish weekday Field Note, Refresh Identity Radar]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# This is the only workflow allowed to deploy GitHub Pages.
# A newer deployment supersedes any queued/stuck older deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check local site integrity
        run: python scripts/check_site.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  external-links:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Probe external links after publishing
        run: python scripts/check_external_links.py
