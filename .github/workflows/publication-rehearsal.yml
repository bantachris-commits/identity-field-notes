name: Rehearse morning publication
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publication-rehearsal.yml']

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
      BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements-automation.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_site.py
      - name: Rehearse model, discovery, recap, community, and email rendering
        run: python scripts/rehearse_publication.py
